spring.application.name=payment-service
server.port=8085

# DB
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${DB_NAME:payment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:ecom_user}
spring.datasource.password=${MYSQL_PASSWORD:ecom_pass}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT
authservice.app.jwtSecret=${JWT_SECRET:my_secret_key_should_be_of_32_characters_as_H26_requires}
authservice.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Stripe Keys
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:pk_test}
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_test}

# Service URLs
auth.service.url=AUTH-SERVICE
order.service.url=ORDER-SERVICE

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
payment.event = payment-events

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://${EUREKA_HOST:localhost}:8761/eureka/}
eureka.instance.preferIpAddress=true
