server:
  port: 8086

spring:
  application:
    name: api-gateway

  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379

  cloud:
    gateway:
        routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
#  docker:
#    compose:
#      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: my_secret_key_should_be_of_32_characters_as_H26_requires
  expirationMs: 86400000
